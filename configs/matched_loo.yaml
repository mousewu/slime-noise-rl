noise_rl:
  method: matched
  group_size: 8
  scenarios: 2
  baseline: loo
  std_normalization: false
  # Global SGLang request capacity.  With 8 GPUs and 2 GPUs per engine, this
  # becomes 8 concurrent requests for each of the 4 rollout engines.
  concurrency: 32
  # Legacy in-process environment RPC workers.  Process runners below raise
  # the actual RPC capacity to their own count for ALFWorld.
  environment_workers: 1
  # Each live ALFWorld trajectory leases one stateful TextWorld process.  This
  # permits 32 trajectories to execute genuine environment steps in parallel
  # without sharing TextWorld's non-thread-safe parser.
  environment_processes: 32
  noise:
    action_drop: 0.15
    observation_loss: 0.10
