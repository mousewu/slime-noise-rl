noise_rl:
  method: matched
  group_size: 8
  scenarios: 2
  baseline: loo
  std_normalization: false
  # Global SGLang request capacity.  With 8 GPUs and 2 GPUs per engine, this
  # becomes 8 concurrent requests for each of the 4 rollout engines.
  concurrency: 32
  # One ALFWorld/TextWorld step is parser-serialized per rollout worker because
  # TextWorld's grammar parser is not thread-safe.  The worker thread still
  # keeps this wait from blocking the asyncio loop.
  environment_workers: 1
  noise:
    action_drop: 0.15
    observation_loss: 0.10
