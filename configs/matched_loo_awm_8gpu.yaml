noise_rl:
  method: matched
  group_size: 8
  scenarios: 2
  baseline: loo
  std_normalization: false
  # Three TP=2 rollout engines.  The launcher divides this total capacity by
  # engine count, yielding 16 concurrent requests for each engine.
  concurrency: 48
  environment_workers: 32
  environment_processes: 0
  awm_url: http://127.0.0.1:8899
  max_turns: 40
  max_tool_calls: 50
  # AWM injects the full tool schema into the first user observation.  Run
  # scripts/audit_awm_context.sh before training and do not admit a task whose
  # initial prompt reaches this strict budget.
  max_context_tokens: 16384
  max_generated_tokens: 2048
  max_tokens_per_turn: 256
  request_timeout: 180
  retry_limit: 0
  noise:
    action_drop: 0.15
    observation_loss: 0.10
